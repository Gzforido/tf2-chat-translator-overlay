<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">TF2 Chat Translator Overlay</title>
  <desc id="description">Dark blue gradient banner with a custom chat translation symbol and the line Understand every callout.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.55" stop-color="#0A334D"/>
      <stop offset="1" stop-color="#086B97"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41D9D0"/>
      <stop offset="1" stop-color="#58A9F5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#42D6E0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#42D6E0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B5EAF2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1010" cy="50" r="300" fill="url(#glow)"/>
    <path d="M 0 274 H 1200" stroke="#B5EAF2" stroke-opacity="0.12"/>
    <rect x="0" y="274" width="600" height="46" fill="#06131F" fill-opacity="0.3"/>
    <rect x="600" y="274" width="600" height="46" fill="#05253B" fill-opacity="0.18"/>
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>
    <rect x="1084" y="0" width="116" height="5" fill="#F47569"/>

    <!-- Custom icon: incoming chat and a translated reply. -->
    <rect x="58" y="71" width="94" height="94" rx="24" fill="#122D43" stroke="#6EE9E3" stroke-width="2"/>
    <path d="M 82 96 H 127 C 132 96 136 100 136 105 V 125 C 136 130 132 134 127 134 H 105 L 92 146 V 134 H 82 C 77 134 73 130 73 125 V 105 C 73 100 77 96 82 96 Z" fill="none" stroke="#F5FCFF" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 91 115 H 116 M 108 108 L 116 115 L 108 122" fill="none" stroke="#64D9E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="184" y="113" fill="#F5FCFF" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="800" letter-spacing="1">TF2 CHAT</text>
    <text x="184" y="169" fill="#F5FCFF" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="800" letter-spacing="1">TRANSLATOR</text>
    <text x="185" y="207" fill="#79E7E5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8">OVERLAY</text>

    <path d="M 672 68 V 224" stroke="#C8EBF4" stroke-opacity="0.48" stroke-width="2"/>
    <text x="724" y="112" fill="#F5FCFF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Understand every</text>
    <text x="724" y="151" fill="#F5FCFF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">callout.</text>
    <text x="726" y="196" fill="#ADD5E4" font-family="Segoe UI, Arial, sans-serif" font-size="20">Live chat translation</text>
    <text x="726" y="225" fill="#ADD5E4" font-family="Segoe UI, Arial, sans-serif" font-size="20">+ inventory value overlay</text>

    <circle cx="63" cy="297" r="5" fill="#55BFF0"/>
    <circle cx="81" cy="297" r="5" fill="#F47569"/>
    <text x="104" y="303" fill="#B5D8E8" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="2">WINDOWS · PYTHON · OPEN SOURCE</text>
    <text x="1103" y="303" fill="#B5D8E8" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="end">GZFORIDO</text>
  </g>
</svg>
